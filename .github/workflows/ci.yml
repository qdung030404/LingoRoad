name: LingoRoad CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ==========================================
  # JOB 1: Backend CI (NestJS + Prisma)
  # ==========================================
  backend-ci:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lingoroad_demo_test?schema=public"
      JWT_SECRET: "ci_jwt_secret_lingoroad_super_secure_key"
      INTERNAL_SERVICE_KEY: "ci_internal_service_key_lingoroad"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingoroad_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd apps/backend
          npx prisma generate

      - name: Typecheck & Build Backend
        run: |
          cd apps/backend
          npm run build

      - name: Verify Prisma Schema Drift and SQL Constraints
        env:
          SHADOW_DATABASE_SERVER_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: |
          cd apps/backend
          npx prisma migrate deploy
          npm run prisma:verify-schema

      - name: Run Backend Unit Tests
        run: |
          cd apps/backend
          npm run test

      - name: Validate Demo Content and HTTP E2E
        env:
          AUTH_PROVIDER: legacy
        run: |
          cd apps/backend
          npx ts-node prisma/demo-content/validate.spec.ts
          npx prisma migrate deploy
          npm run test:e2e -- --runInBand

      - name: Firebase Auth and Learning HTTP E2E
        env:
          AUTH_PROVIDER: firebase
          FIREBASE_PROJECT_ID: demo-lingoroad
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: |
          npx --yes firebase-tools@14.20.0 emulators:exec --only auth --project demo-lingoroad "npm run test:firebase:e2e --workspace apps/backend && npm run test:learning:e2e --workspace apps/backend && npm run test:daily:e2e --workspace apps/backend && npm run test:vocabulary:e2e --workspace apps/backend"

  # ==========================================
  # JOB 2: AI / ML Service CI (FastAPI + PyTorch)
  # ==========================================
  ml-ci:
    name: ML Service (FastAPI + PyTorch)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "apps/ml"
      INTERNAL_SERVICE_KEY: "ci_internal_service_key_lingoroad"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r apps/ml/requirements.txt
          python -m nltk.downloader wordnet

      - name: Run ML Unit Tests
        run: |
          cd apps/ml
          pytest tests/ -v

  # ==========================================
  # JOB 3: Mobile App CI (Flutter)
  # ==========================================
  mobile-ci:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Analyze Mobile Code (Lint & Conventions)
        run: |
          cd apps/mobile
          flutter analyze

      - name: Run Mobile Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

      - name: Build Android APK (Test Build Verification)
        run: |
          cd apps/mobile
          flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7


  # ==========================================
  # JOB 4: Web Frontend CI (Next.js)
  # ==========================================
  web-frontend-ci:
    name: Web Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Web Frontend
        run: npx tsc -p apps/web-frontend/tsconfig.json --noEmit

      - name: Lint Web Frontend
        run: npm run lint --workspace=apps/web-frontend

      - name: Run Web Frontend Tests
        run: npm run test --workspace=apps/web-frontend

      - name: Build Web Frontend (Cloud URL Verification)
        env:
          NEXT_PUBLIC_API_URL: https://lingoroad-api-ci-verify.azurewebsites.net
          LINGOROAD_REQUIRE_CLOUD_API_URL: 'true'
        run: npm run frontend:build

  # ==========================================
  # JOB 5: Auto-Deploy ML, Backend & Web Admin to Azure (main only)
  # ==========================================
  deploy-azure-admin:
    name: Deploy ML, Admin & Backend (Azure)
    needs: [backend-ci, web-frontend-ci, ml-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: azure-lingoroad-admin-deploy
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-lingoroad-demo-web' }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME || 'lingoroad6e9f265b' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Audit Production Dependencies (Block Critical Vulnerabilities)
        run: |
          npm audit --omit=dev --audit-level=critical --workspace=apps/backend
          npm audit --omit=dev --audit-level=critical --workspace=apps/web-frontend

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Target Apps & Record Current Running Image Digests
        id: record_state
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          RG="${AZURE_RESOURCE_GROUP}"
          ACR_SERVER="${AZURE_ACR_NAME}.azurecr.io"

          BACKEND_APP="${{ vars.AZURE_BACKEND_APP_NAME }}"
          FRONTEND_APP="${{ vars.AZURE_FRONTEND_APP_NAME }}"
          ML_APP="${{ vars.AZURE_ML_APP_NAME }}"

          if [ -z "${BACKEND_APP}" ]; then
            BACKEND_APP=$(az webapp list -g "${RG}" --query "[?starts_with(name, 'lingoroad-api-')].name | [0]" -o tsv)
          fi
          if [ -z "${FRONTEND_APP}" ]; then
            FRONTEND_APP=$(az webapp list -g "${RG}" --query "[?starts_with(name, 'lingoroad-admin-')].name | [0]" -o tsv)
          fi
          if [ -z "${ML_APP}" ]; then
            ML_APP=$(az containerapp list -g "${RG}" --query "[?starts_with(name, 'lingoroad-ml-')].name | [0]" -o tsv || true)
          fi

          if [ -z "${BACKEND_APP}" ] || [ -z "${FRONTEND_APP}" ]; then
            echo "Không tìm thấy ứng dụng App Service trong resource group ${RG}. Hãy chạy scripts/azure-bootstrap.ps1 trước." >&2
            exit 1
          fi

          BACKEND_URL="https://${BACKEND_APP}.azurewebsites.net"
          FRONTEND_URL="https://${FRONTEND_APP}.azurewebsites.net"

          PREV_BACKEND_FX=$(az webapp config show -g "${RG}" -n "${BACKEND_APP}" --query "linuxFxVersion" -o tsv)
          PREV_FRONTEND_FX=$(az webapp config show -g "${RG}" -n "${FRONTEND_APP}" --query "linuxFxVersion" -o tsv)

          PREV_BACKEND_IMAGE="${PREV_BACKEND_FX#DOCKER|}"
          PREV_FRONTEND_IMAGE="${PREV_FRONTEND_FX#DOCKER|}"

          ML_URL=""
          PREV_ML_IMAGE=""
          if [ -n "${ML_APP}" ]; then
            ML_FQDN=$(az containerapp show -g "${RG}" -n "${ML_APP}" --query "properties.configuration.ingress.fqdn" -o tsv)
            ML_URL="https://${ML_FQDN}"
            PREV_ML_IMAGE=$(az containerapp show -g "${RG}" -n "${ML_APP}" --query "properties.template.containers[0].image" -o tsv)
          fi

          {
            echo "acr_server=${ACR_SERVER}"
            echo "backend_app=${BACKEND_APP}"
            echo "frontend_app=${FRONTEND_APP}"
            echo "ml_app=${ML_APP}"
            echo "backend_url=${BACKEND_URL}"
            echo "frontend_url=${FRONTEND_URL}"
            echo "ml_url=${ML_URL}"
            echo "prev_backend_image=${PREV_BACKEND_IMAGE}"
            echo "prev_frontend_image=${PREV_FRONTEND_IMAGE}"
            echo "prev_ml_image=${PREV_ML_IMAGE}"
          } >> "$GITHUB_OUTPUT"

          echo "Recorded previous backend image : ${PREV_BACKEND_IMAGE}"
          echo "Recorded previous frontend image: ${PREV_FRONTEND_IMAGE}"
          echo "Recorded previous ML image      : ${PREV_ML_IMAGE}"

      - name: Build ML, Backend & Web Admin Images Tagged by Commit SHA
        run: |
          set -euo pipefail
          ACR_SERVER="${{ steps.record_state.outputs.acr_server }}"
          SHA="${{ github.sha }}"
          BACKEND_URL="${{ steps.record_state.outputs.backend_url }}"

          docker build \
            -f apps/ml/Dockerfile \
            -t "${ACR_SERVER}/lingoroad-ml:${SHA}" \
            apps/ml

          docker build \
            -f apps/backend/Dockerfile \
            --build-arg APP_VERSION="${SHA}" \
            -t "${ACR_SERVER}/lingoroad-backend:${SHA}" \
            .

          docker build \
            -f apps/web-frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="${BACKEND_URL}" \
            --build-arg NEXT_PUBLIC_APP_VERSION="${SHA}" \
            --build-arg APP_VERSION="${SHA}" \
            -t "${ACR_SERVER}/lingoroad-web-admin:${SHA}" \
            .

      - name: Scan ML Image for Critical Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.record_state.outputs.acr_server }}/lingoroad-ml:${{ github.sha }}"
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Scan Backend Image for Critical Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.record_state.outputs.acr_server }}/lingoroad-backend:${{ github.sha }}"
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Scan Web Admin Image for Critical Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.record_state.outputs.acr_server }}/lingoroad-web-admin:${{ github.sha }}"
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Images to ACR and Resolve Immutable Digests
        id: push_images
        run: |
          set -euo pipefail
          ACR_NAME="${AZURE_ACR_NAME}"
          ACR_SERVER="${{ steps.record_state.outputs.acr_server }}"
          SHA="${{ github.sha }}"

          az acr login --name "${ACR_NAME}"

          docker push "${ACR_SERVER}/lingoroad-ml:${SHA}"
          docker push "${ACR_SERVER}/lingoroad-backend:${SHA}"
          docker push "${ACR_SERVER}/lingoroad-web-admin:${SHA}"

          ML_DIGEST=$(az acr repository show-manifests \
            --name "${ACR_NAME}" \
            --repository lingoroad-ml \
            --query "[?contains(tags, '${SHA}')].digest | [0]" -o tsv)

          BACKEND_DIGEST=$(az acr repository show-manifests \
            --name "${ACR_NAME}" \
            --repository lingoroad-backend \
            --query "[?contains(tags, '${SHA}')].digest | [0]" -o tsv)

          FRONTEND_DIGEST=$(az acr repository show-manifests \
            --name "${ACR_NAME}" \
            --repository lingoroad-web-admin \
            --query "[?contains(tags, '${SHA}')].digest | [0]" -o tsv)

          if [ -z "${ML_DIGEST}" ] || [ -z "${BACKEND_DIGEST}" ] || [ -z "${FRONTEND_DIGEST}" ]; then
            echo "Không thể lấy digest từ ACR cho SHA ${SHA}." >&2
            exit 1
          fi

          ML_IMAGE_REF="${ACR_SERVER}/lingoroad-ml@${ML_DIGEST}"
          BACKEND_IMAGE_REF="${ACR_SERVER}/lingoroad-backend@${BACKEND_DIGEST}"
          FRONTEND_IMAGE_REF="${ACR_SERVER}/lingoroad-web-admin@${FRONTEND_DIGEST}"

          {
            echo "ml_digest=${ML_DIGEST}"
            echo "backend_digest=${BACKEND_DIGEST}"
            echo "frontend_digest=${FRONTEND_DIGEST}"
            echo "ml_image_ref=${ML_IMAGE_REF}"
            echo "backend_image_ref=${BACKEND_IMAGE_REF}"
            echo "frontend_image_ref=${FRONTEND_IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy ML Container App by Digest and Wait for /health
        id: deploy_ml
        if: steps.record_state.outputs.ml_app != ''
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          RG="${AZURE_RESOURCE_GROUP}"
          ML_APP="${{ steps.record_state.outputs.ml_app }}"
          ML_IMAGE_REF="${{ steps.push_images.outputs.ml_image_ref }}"
          ML_URL="${{ steps.record_state.outputs.ml_url }}"

          az containerapp update -g "${RG}" -n "${ML_APP}" \
            --image "${ML_IMAGE_REF}" --output none

          echo "Waiting for ML /health at ${ML_URL}/health ..."
          ML_HEALTHY="false"
          for i in $(seq 1 36); do
            if RESP=$(curl -fsS --max-time 10 "${ML_URL}/health" 2>/dev/null); then
              if echo "${RESP}" | grep -q '"status":"ok"'; then
                echo "ML Service is healthy: ${RESP}"
                ML_HEALTHY="true"
                break
              fi
            fi
            sleep 5
          done

          if [ "${ML_HEALTHY}" != "true" ]; then
            echo "ML Service /health không đạt sau 180 giây." >&2
            exit 1
          fi

      - name: Deploy Backend by Digest and Wait for /health (DB & Schema Ready)
        id: deploy_backend
        run: |
          set -euo pipefail
          RG="${AZURE_RESOURCE_GROUP}"
          APP="${{ steps.record_state.outputs.backend_app }}"
          IMAGE_REF="${{ steps.push_images.outputs.backend_image_ref }}"
          ACR_SERVER="${{ steps.record_state.outputs.acr_server }}"
          BACKEND_URL="${{ steps.record_state.outputs.backend_url }}"

          az webapp config appsettings set -g "${RG}" -n "${APP}" \
            --settings APP_VERSION="${{ github.sha }}" --output none

          az webapp config container set -g "${RG}" -n "${APP}" \
            --container-image-name "${IMAGE_REF}" \
            --container-registry-url "https://${ACR_SERVER}" --output none

          az webapp restart -g "${RG}" -n "${APP}" --output none

          echo "Waiting for Backend /health at ${BACKEND_URL}/health ..."
          EXPECTED_SHA="${{ github.sha }}"
          HEALTHY="false"
          for i in $(seq 1 36); do
            if RESP=$(curl -fsS --max-time 10 "${BACKEND_URL}/health" 2>/dev/null); then
              if echo "${RESP}" | grep -q '"database":"ready"' \
                && echo "${RESP}" | grep -q '"schema":"ready"' \
                && echo "${RESP}" | grep -q "\"version\":\"${EXPECTED_SHA}\""; then
                echo "Backend is healthy: ${RESP}"
                HEALTHY="true"
                break
              fi
            fi
            sleep 5
          done

          if [ "${HEALTHY}" != "true" ]; then
            echo "Backend /health không đạt sau 180 giây. Chặn phát hành Frontend!" >&2
            exit 1
          fi

      - name: Deploy Web Admin by Digest and Run Full Smoke Test
        id: deploy_frontend
        run: |
          set -euo pipefail
          RG="${AZURE_RESOURCE_GROUP}"
          APP="${{ steps.record_state.outputs.frontend_app }}"
          IMAGE_REF="${{ steps.push_images.outputs.frontend_image_ref }}"
          ACR_SERVER="${{ steps.record_state.outputs.acr_server }}"
          BACKEND_URL="${{ steps.record_state.outputs.backend_url }}"
          FRONTEND_URL="${{ steps.record_state.outputs.frontend_url }}"
          ML_URL="${{ steps.record_state.outputs.ml_url }}"

          az webapp config appsettings set -g "${RG}" -n "${APP}" \
            --settings APP_VERSION="${{ github.sha }}" NEXT_PUBLIC_APP_VERSION="${{ github.sha }}" --output none

          az webapp config container set -g "${RG}" -n "${APP}" \
            --container-image-name "${IMAGE_REF}" \
            --container-registry-url "https://${ACR_SERVER}" --output none

          az webapp restart -g "${RG}" -n "${APP}" --output none

          SMOKE_ARGS=(
            --backend-url "${BACKEND_URL}"
            --frontend-url "${FRONTEND_URL}"
            --expected-version "${{ github.sha }}"
          )
          if [ -n "${ML_URL}" ]; then
            SMOKE_ARGS+=(--ml-url "${ML_URL}")
          fi

          node scripts/azure-smoke-test.mjs "${SMOKE_ARGS[@]}" | tee smoke-test-result.json

      - name: Automatic Rollback on Deployment or Smoke Test Failure
        if: failure() && steps.record_state.outcome == 'success'
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          RG="${AZURE_RESOURCE_GROUP}"
          ACR_SERVER="${{ steps.record_state.outputs.acr_server }}"
          BACKEND_APP="${{ steps.record_state.outputs.backend_app }}"
          FRONTEND_APP="${{ steps.record_state.outputs.frontend_app }}"
          ML_APP="${{ steps.record_state.outputs.ml_app }}"
          PREV_BACKEND="${{ steps.record_state.outputs.prev_backend_image }}"
          PREV_FRONTEND="${{ steps.record_state.outputs.prev_frontend_image }}"
          PREV_ML="${{ steps.record_state.outputs.prev_ml_image }}"

          echo "Phát hiện lỗi sau khi cập nhật! Đang khôi phục image trước đó..."
          if [ -n "${ML_APP}" ] && [ -n "${PREV_ML}" ] && [[ "${PREV_ML}" != *":bootstrap" ]]; then
            az containerapp update -g "${RG}" -n "${ML_APP}" \
              --image "${PREV_ML}" --output none || true
          fi

          if [ -n "${PREV_BACKEND}" ] && [[ "${PREV_BACKEND}" != *":bootstrap" ]]; then
            az webapp config container set -g "${RG}" -n "${BACKEND_APP}" \
              --container-image-name "${PREV_BACKEND}" \
              --container-registry-url "https://${ACR_SERVER}" --output none
            az webapp restart -g "${RG}" -n "${BACKEND_APP}" --output none
          fi

          if [ -n "${PREV_FRONTEND}" ] && [[ "${PREV_FRONTEND}" != *":bootstrap" ]]; then
            az webapp config container set -g "${RG}" -n "${FRONTEND_APP}" \
              --container-image-name "${PREV_FRONTEND}" \
              --container-registry-url "https://${ACR_SERVER}" --output none
            az webapp restart -g "${RG}" -n "${FRONTEND_APP}" --output none
          fi
          echo "Đã gửi lệnh khôi phục image trước đó."

      - name: Save Release Digest Manifest and Smoke Test Evidence
        if: always() && steps.push_images.outcome == 'success'
        run: |
          cat <<EOF > release-manifest.json
          {
            "commitSha": "${{ github.sha }}",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "resourceGroup": "${AZURE_RESOURCE_GROUP}",
            "ml": {
              "appName": "${{ steps.record_state.outputs.ml_app }}",
              "url": "${{ steps.record_state.outputs.ml_url }}",
              "digest": "${{ steps.push_images.outputs.ml_digest }}",
              "imageRef": "${{ steps.push_images.outputs.ml_image_ref }}",
              "previousImageRef": "${{ steps.record_state.outputs.prev_ml_image }}"
            },
            "backend": {
              "appName": "${{ steps.record_state.outputs.backend_app }}",
              "url": "${{ steps.record_state.outputs.backend_url }}",
              "digest": "${{ steps.push_images.outputs.backend_digest }}",
              "imageRef": "${{ steps.push_images.outputs.backend_image_ref }}",
              "previousImageRef": "${{ steps.record_state.outputs.prev_backend_image }}"
            },
            "frontend": {
              "appName": "${{ steps.record_state.outputs.frontend_app }}",
              "url": "${{ steps.record_state.outputs.frontend_url }}",
              "digest": "${{ steps.push_images.outputs.frontend_digest }}",
              "imageRef": "${{ steps.push_images.outputs.frontend_image_ref }}",
              "previousImageRef": "${{ steps.record_state.outputs.prev_frontend_image }}"
            }
          }
          EOF

          {
            echo "### LingoRoad Azure Release Summary"
            echo "- **Commit SHA**: \`${{ github.sha }}\`"
            echo "- **ML Service URL**: ${{ steps.record_state.outputs.ml_url }}"
            echo "- **ML Digest**: \`${{ steps.push_images.outputs.ml_digest }}\`"
            echo "- **Backend URL**: ${{ steps.record_state.outputs.backend_url }}"
            echo "- **Backend Digest**: \`${{ steps.push_images.outputs.backend_digest }}\`"
            echo "- **Web Admin URL**: ${{ steps.record_state.outputs.frontend_url }}"
            echo "- **Web Admin Digest**: \`${{ steps.push_images.outputs.frontend_digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release Manifest & Smoke Test Artifact
        if: always() && steps.push_images.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: azure-release-${{ github.sha }}
          path: |
            release-manifest.json
            smoke-test-result.json
          if-no-files-found: warn
          retention-days: 30

