name: LingoRoad CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Backend CI (NestJS + Prisma)
  # ==========================================
  backend-ci:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lingoroad_test?schema=public"
      JWT_SECRET: "ci_jwt_secret_lingoroad_super_secure_key"
      INTERNAL_SERVICE_KEY: "ci_internal_service_key_lingoroad"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd apps/backend
          npx prisma generate

      - name: Typecheck & Build Backend
        run: |
          cd apps/backend
          npm run build

      - name: Run Backend Unit Tests
        run: |
          cd apps/backend
          npm run test

  # ==========================================
  # JOB 2: AI / ML Service CI (FastAPI + PyTorch)
  # ==========================================
  ml-ci:
    name: ML Service (FastAPI + PyTorch)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "apps/ml"
      INTERNAL_SERVICE_KEY: "ci_internal_service_key_lingoroad"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r apps/ml/requirements.txt
          python -m nltk.downloader wordnet

      - name: Run ML Unit Tests
        run: |
          cd apps/ml
          pytest tests/ -v

  # ==========================================
  # JOB 3: Mobile App CI (Flutter)
  # ==========================================
  mobile-ci:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Analyze Mobile Code (Lint & Conventions)
        run: |
          cd apps/mobile
          flutter analyze

      - name: Run Mobile Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

      - name: Build Android APK (Test Build Verification)
        run: |
          cd apps/mobile
          flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

